services:
  postgres:
    image: postgres:16
    container_name: pastaneapp-postgres
    environment:
      POSTGRES_DB: pastaneapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pastaneapp-postgres-data:/var/lib/postgresql/data

volumes:
  pastaneapp-postgres-data:
